services:
  ollama:
    image: ollama/ollama:latest
    container_name: localllm-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile:/Modelfile
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 4G
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "================================"
        echo "Starting Ollama service..."
        echo "================================"
        ollama serve &
        SERVER_PID=$$!
        sleep 10
        echo ""
        echo "================================"
        echo "Creating custom model..."
        echo "================================"
        ollama create custom-chatbot-model -f /Modelfile
        echo ""
        echo "================================"
        echo "Pulling embedding model..."
        echo "================================"
        ollama pull embeddinggemma
        echo ""
        echo "================================"
        echo "✓ Models ready! You can now run your application"
        echo "================================"
        wait $$SERVER_PID

  db:
    image: pgvector/pgvector:pg16
    container_name: localllm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${PG_DATABASE:-rag_db}
      POSTGRES_USER: ${PG_USER:-user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER:-user} -d ${PG_DATABASE:-rag_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: ${SERVER_BUILD_TARGET:-runtime}
    container_name: localllm-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./server/src/server:/usr/local/lib/python3.12/site-packages/server:ro
      - ./common/src/common:/app/common/src/common:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DATABASE=${PG_DATABASE:-rag_db}
      - PG_USER=${PG_USER:-user}
      - PG_PASSWORD=${PG_PASSWORD:-password}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - SERVER_RELOAD=${SERVER_RELOAD:-false}
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  ollama_data:
  db_data:
