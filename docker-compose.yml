services:
  ollama:
    image: ollama/ollama:latest
    container_name: localllm-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile:/Modelfile
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 4G
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "================================"
        echo "Starting Ollama service..."
        echo "================================"
        ollama serve &
        SERVER_PID=$$!
        sleep 10
        echo ""
        echo "================================"
        echo "Creating custom model..."
        echo "================================"
        ollama create custom-chatbot-model -f /Modelfile
        echo ""
        echo "================================"
        echo "Pulling embedding model..."
        echo "================================"
        ollama pull embeddinggemma
        echo ""
        echo "================================"
        echo "✓ Models ready! You can now run your application"
        echo "================================"
        wait $$SERVER_PID

  db:
    image: pgvector/pgvector:pg16
    container_name: localllm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d rag_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ollama_data:
  db_data:
