[project]
name = "cli"
version = "0.1.0"
description = "CLI for interacting with a local LLM"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cli"]
