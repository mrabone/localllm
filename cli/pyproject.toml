[project]
name = "cli"
version = "0.1.0"
description = "CLI for interacting with a local LLM"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.1",
    "langchain",
    "langchain-community",
    "psycopg2-binary",
    "langchain-ollama",
    "langchain-postgres",
    "sqlalchemy",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cli"]
