[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing tools for the localLLM application"
requires-python = ">=3.11"
dependencies = [
    "common",
    "fastmcp>=2.0.0",
    "langchain-ollama",
    "langchain-postgres",
    "mem0ai",
    "ollama>=0.6.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mcp_server"]
